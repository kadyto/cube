# Copia este archivo en un stack de Dockhand. No necesitas clonar el repositorio.
# Requiere que el código de la aplicación ya esté incorporado en main.
services:
  cube:
    build:
      context: https://github.com/kadyto/cube.git#main
    init: true
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8093}:3000'
    environment:
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Define la contraseña inicial de tu espacio privado}
      DATABASE_PATH: /data/cube.sqlite
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TZ: Europe/Madrid
    volumes:
      - cube_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s

volumes:
  cube_data:
